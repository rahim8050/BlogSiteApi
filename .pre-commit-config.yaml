repos:
  - repo: local
    hooks:
      - id: laravel-pint
        name: Laravel Pint (PHP Code Style)
        entry: vendor/bin/pint
        language: system
        types: [php]
        pass_filenames: false
        stages: [pre-commit]
        files: ^app/|^config/|^database/|^routes/|^tests/

      - id: phpstan
        name: PHPStan (Static Analysis)
        entry: vendor/bin/phpstan
        language: system
        types: [php]
        pass_filenames: false
        stages: [pre-commit]
        files: ^app/